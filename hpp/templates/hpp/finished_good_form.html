{% extends "hpp/base.html" %}

{% block title %}Tambah Barang Jadi - HPP & BOM{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
                <a href="{% url 'stock_report' %}" class="text-indigo-600 hover:underline">Barang Jadi</a>
                <span>&rsaquo;</span>
                <span>Tambah Barang Jadi</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Tambah Barang Jadi Baru</h1>
            <p class="text-sm text-slate-500">Daftarkan SKU, harga cost standar, dan jumlah saldo awal persediaan fisik.</p>
        </div>
        <a href="{% url 'stock_report' %}" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-md">
            &larr; Kembali
        </a>
    </div>

    <!-- Form Container -->
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">SKU / Kode Barang *</label>
                    <input type="text" name="sku" required placeholder="FG-CHR-003" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Satuan *</label>
                    <select name="unit" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500 font-semibold">
                        {% for u in unit_fgs %}
                        <option value="{{ u.code }}">{{ u.name }} ({{ u.code }})</option>
                        {% empty %}
                        <option value="unit">Unit (unit)</option>
                        <option value="set">Set (set)</option>
                        <option value="pcs">Pieces (pcs)</option>
                        <option value="box">Box (box)</option>
                        <option value="panel">Panel (panel)</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Barang Jadi *</label>
                <input type="text" name="name" required placeholder="Contoh: Kursi Kerja Ergonomis Mesh Grey" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Harga Cost Standar (Rp)</label>
                    <input type="number" step="0.01" name="standard_cost" value="0" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Stock Awal Gudang</label>
                    <input type="number" step="0.01" name="initial_stock" value="0" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Catatan / Spesifikasi Tambahan</label>
                <textarea name="notes" rows="3" placeholder="Keterangan dimensi, warna, bahan, lokasi rak..." class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm"></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                <a href="{% url 'stock_report' %}" class="px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-md hover:bg-slate-200">Batal</a>
                <button type="submit" class="px-5 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-md hover:bg-indigo-700 shadow">Simpan Barang Jadi</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
